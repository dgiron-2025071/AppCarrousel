name: Validación

on:
  push:
    branches: [develop, main, dgiron-2025071]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  base-de-datos:
    name: Base de datos e importador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - run: pnpm --dir tools/db-validation install --frozen-lockfile
      - run: pnpm --dir tools/db-validation test
      - run: pnpm --dir tools/importar-ceco test

  edge-function:
    name: Edge Function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/invitar-usuario/*.ts supabase/functions/tests/*.ts
      - run: deno lint supabase/functions/invitar-usuario/*.ts supabase/functions/tests/*.ts
      - run: deno fmt --check supabase/functions/invitar-usuario/*.ts supabase/functions/tests/*.ts
      - run: deno test -A supabase/functions/tests/*.ts
